# 오름오름 멀티 서버 (#7): Cloudflare Workers + Durable Objects
# 배포: GitHub Actions deploy-server.yml (시크릿 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID)
# 세션 서명 키는 시크릿: wrangler secret put SESSION_SECRET
name = "oreumoreum"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GOOGLE_CLIENT_ID = "185091365310-fae1ordhatv7quuj3g6ah7cts129d1l2.apps.googleusercontent.com"
ALLOW_ORIGINS = "https://spacehwi.github.io"
# 로컬에서만: FAKE_AUTH=1 이면 'fake:아무거나' 로 로그인 (npm run dev 가 켬)
FAKE_AUTH = ""
STATS_OPEN = ""
# 로컬 검사에서만 (FAKE_AUTH 일 때): 귤 주기(#175) 새 계정 기다림(초). 비우면 balance.js GIVE.newSec
GIFT_NEW_SEC = ""

# 어드민 (#84): 시크릿 ADMIN_SUBS = 어드민 구글 계정 sub (쉼표로 여럿). 없으면 아무도 어드민이 아님 (wrangler secret put ADMIN_SUBS)
# 세션 서명 키 SESSION_SECRET 은 32자 이상. 없거나 짧으면 서버는 /health 말고 모두 503

# 요청 수 제한 (#84): 주소(IP 해시)별 1분 상한. Worker 메모리 제한과 함께 씀 (값은 src/balance.js NET 과 맞춤)
[[ratelimits]]
name = "RL_API"
namespace_id = "8401"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "8402"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_WS"
namespace_id = "8403"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Accounts"]

# 날마다 한 번 (UTC 18:17 = 한국 03:17): 마지막 접속 뒤 7일 지난 계정 지우기
[triggers]
crons = ["17 18 * * *"]

# 의견 보내기 (#77): Cloudflare Email Routing 으로 개발자 메일에 보냄
# 켜는 법: 1) 대시보드에서 도메인의 Email Routing 켜기 2) 받는 주소(개발자 메일)를 Destination address 로 인증
#          3) 아래 주석을 풀기 4) 시크릿: wrangler secret put FEEDBACK_TO (받는 주소) · FEEDBACK_FROM (그 도메인의 보내는 주소, 예: feedback@도메인)
# 바인딩이나 시크릿이 없으면 서버는 글을 저장만 함(메일 없음). 받는 주소는 공개 코드에 넣지 않음
# [[send_email]]
# name = "FEEDBACK_MAIL"
